name: CI

# Runs the full test suite automatically on every push/PR (2026-09-05 audit
# fix) - before this, all 98+ tests only ever ran if someone remembered to
# run them by hand. Needs only DATABASE_URL + AUTH_SECRET to work
# (src/lib/env/server.ts) - OPENAI_API_KEY is deliberately left unset, so
# every AI call in the app falls back to its own mock provider
# automatically (src/lib/ai/index.ts) - this suite never spends real
# OpenAI/Anthropic money to run.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hango
          POSTGRES_PASSWORD: hango
          POSTGRES_DB: hango_local_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U hango -d hango_local_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Match the pinned disposable target accepted by the Journey suites.
      # This service exists only for this job, never a shared app database.
      DATABASE_URL: postgresql://hango:hango@127.0.0.1:54329/hango_local_test
      DIRECT_URL: postgresql://hango:hango@127.0.0.1:54329/hango_local_test
      # Never a real secret - CI only needs *a* 32+ char value to satisfy
      # src/lib/env/server.ts's validation, nothing here reads real user
      # sessions.
      AUTH_SECRET: ci-only-placeholder-value-not-a-real-secret-32chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          # SEC-11 scans every reachable commit, not only the PR tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Redacted history scan for provider tokens, private keys and committed
      # secret-variable literals. Runs before dependencies or application code.
      - run: npm run security:secrets

      - run: npm ci

      # Gitignored (regenerated per-environment) - nothing else in this
      # workflow can import `@/generated/prisma/client` until this runs.
      - run: npx prisma generate

      - run: npx prisma migrate deploy

      # Every integration test assumes the real authored curriculum exists
      # (project/TASKS.md's own note on tests/integration/content.test.ts) -
      # migrate deploy only creates empty tables. The CI Postgres container
      # starts with zero rows, so without this every scenario/lesson/
      # placement-question lookup returns null and the suite fails for a
      # reason that has nothing to do with the code under test.
      - run: npm run db:seed

      # prisma/seed.ts doesn't include the placement exam's question bank -
      # it's a separate, standalone script (2026-09-14 CI investigation:
      # without this, every adaptive placement-exam.test.ts case fails on
      # an empty PlacementQuestion table).
      - run: npx tsx scripts/seed-placement-exam-full.mjs

      # The committed project/curriculum-translations/es/ packages can't be
      # imported here: the importer's sourceHash is computed over each
      # unit's database-generated id (src/lib/content/curriculum-
      # translation-exchange.ts's sourcePayload), so a fresh db:seed run -
      # which assigns brand new ids to the same authored English text - can
      # never reproduce a matching hash, no matter how the id-equality
      # check itself is handled. This seeds just the handful of Spanish
      # strings the suite actually asserts on (QA-02, 2026-09-16), looked
      # up by stable slug/order instead of a snapshotted id, so it works on
      # any freshly-seeded database. It is not a substitute for the full
      # translation system, which stays scoped to the shared dev database.
      - run: npx tsx scripts/seed-es-fixtures-for-tests.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npx prisma migrate status
      # Runtime audit must be clean. Owner-approved, dev-only braces/ESLint
      # exception through Oct 23 Bogota: exact advisory, versions and paths;
      # any new finding or expiry fails closed (see release 2026-10-16).
      - run: npm run security:audit

      - run: npm run test:unit
      - run: npm run test:component
      # Runs against the disposable Postgres service seeded above; no real
      # learner account or shared development-database ids are required.
      - run: npm run test:integration
      - run: npm run test:smoke
